[package]
name = "feathernix-buildd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FeatherNix buildd: distributed package builder controller and worker"

[[bin]]
name = "feathernix-buildd"
path = "src/main.rs"

[[bin]]
name = "feathernix-buildctl"
path = "src/bin/buildctl.rs"

[dependencies]
feathernix-buildd-proto.workspace = true
feathernix-recipe.workspace = true
feathernix-build.workspace = true
feathernix-publish.workspace = true
feathernix-sign.workspace = true

anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
colored.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["blocking", "rustls", "json", "multipart"] }
rusqlite = { version = "0.43", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.7", features = ["trace"] }

[dev-dependencies]
tempfile.workspace = true
feathernix-archive.workspace = true
feathernix-sign.workspace = true
